services:
  netbox:
    image: netbox:latest-plugins
    pull_policy: never # Не пытаться скачивать образ, использовать локальный
    ports:
      - 8000:8080
    build: # Указываем, как собирать образ
      context: . # Контекст сборки - текущая директория
      dockerfile: Dockerfile-Plugins # Имя Dockerfile
    # Убедимся, что стартовые скрипты выполняются
    # и переменные окружения (например, PLUGINS_CONFIG) учитываются
    # или используем файл конфигурации plugins.py, как в Dockerfile
  netbox-worker:
    image: netbox:latest-plugins
    pull_policy: never
  netbox-housekeeping:
    image: netbox:latest-plugins
    pull_policy: never
